# Redirect mappings
# Format: old_path: new_path
# Paths should be relative (no leading slash) or absolute URLs
# These will generate Apache Redirect 301 rules in .htaccess

redirects:
  # Short public resume URL for print and email. The PDF on misc is overwritten in place, so this never changes.
  - from: /resume/
    to: https://misc.jonplummer.com/Jon-Plummer-resume.pdf
  # Same, without the slash. Must stay after /resume/ – mod_alias takes the first match, and /resume alone would turn /resume/ into the PDF URL plus a slash.
  - from: /resume
    to: https://misc.jonplummer.com/Jon-Plummer-resume.pdf

  # Utility page URL updates
  - from: /style-exercise/
    to: /color/

  - from: /color-test/
    to: /color/

  - from: /og-image-preview/
    to: /ogimages/

  - from: /type/gallery/
    to: /type/

  # Apache Redirect is prefix-based: /uses/ does not match /uses, and listing
  # /uses first would turn /uses/ into /technologies//. Slashed form first.
  - from: /uses/
    to: /technologies/
  - from: /uses
    to: /technologies/

  # Canonical URL aliases
  - from: /home/
    to: /

  # Date corrections and URL changes
  - from: /2022/04/17/empathy-for-the-leader-whose-company-is-being-acquired/
    to: /2022/04/16/empathy-for-the-leader-whose-company-is-being-acquired/
  
  - from: /2022/07/31/the-trouble-with-nps/
    to: /2022/07/30/the-trouble-with-nps/
  
  - from: /2022/11/02/conference-talk-ux-philosophy/
    to: /2022/11/01/conference-talk-ux-philosophy/
  
  - from: /2022/11/09/philosophy-of-ux-research-and-design-horizon-three-benefit/
    to: /2022/11/08/philosophy-of-ux-research-and-design-horizon-three-benefit/
