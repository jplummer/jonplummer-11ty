# Portfolio lists. Each key builds a page at /portfolio/<key>/ from
# src/portfolio-list.njk, showing its pieces in the order given here.
#
# `main` is /portfolio/ itself. It takes only `intro` and `pieces`; the page's
# title and description live in src/portfolio.njk, where the OG generator reads
# them. Reorder or trim main's pieces to curate the public portfolio.
#
#   status:   draft   – builds only under `pnpm run dev`
#             live    – builds everywhere
#             retired – doesn't build; the URL 302s to /portfolio/.
#                       Retire an opportunity's list the day they say no.
#   indexed:  true puts the page in search and the sitemap. Leave it out for
#             every opportunity-specific list; they stay hidden by default.
#   title, description:  the page's <title>/<h1> and meta description.
#   intro:    optional markdown above the grid.
#   pieces:   /portfolio/<slug>/ and /sides/<slug>/ URLs, in display order.
#
# The hidden index at /portfolio/all/ shows every piece and the lists it's in.
# `pnpm run test portfolios` checks this file.

